[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrate-kinetics"
version = "0.1.0"
description = "Readable Python/C++ reaction-rate toolkit targeting Polyrate-compatible workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  {name = "PyRate contributors"}
]
keywords = ["chemical-kinetics", "transition-state-theory", "vtst", "tunneling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["ruff>=0.7", "mypy>=1.11", "build>=1.2"]

[project.scripts]
pyrate = "pyrate.cli:main"

[project.urls]
Repository = "https://github.com/chen-yu-hao/PyRate"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pyrate"]
