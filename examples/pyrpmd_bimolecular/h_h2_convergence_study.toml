# pyrpmd study 收敛扫描：一次只改一个参数（one_at_a_time），其余取最精细值
#   pyrpmd study h_h2_convergence_study.toml --plan          # 只列出算例，不跑动力学
#   pyrpmd study h_h2_convergence_study.toml --output runs/h_h2_study
# 本文件与 h_h2_bkmp2.inp 放在同一目录
schema_version = 1
job = "h_h2_bkmp2.inp"
temperatures = ["300 K", "500 K"]     # force_constant = 0.1 即 k = 0.1·T，窗口宽度与 T 无关
replicates = 2                        # 独立种子重复，用来估计种子间离散
design = "one_at_a_time"
relative_tolerance = 0.05

[convergence]
beads = [16, 32, 64]                          # 珠子数
timestep = ["0.1 fs", "0.05 fs"]              # 步长（所有时长必须仍为整数步）
separation = ["30 bohr", "40 bohr"]   # R∞
